<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reproduza um arquivo de vídeo local no navegador.">
    <meta name="theme-color" content="#0b1220">
    <title>Player de vídeo | Francos Corporation</title>
    <link rel="stylesheet" href="video.css">
    <script src="video-player.js" defer></script>
  </head>
  <body>
    <main class="video-page">
      <a class="back-link" href="index.html">← Voltar ao início</a>
      <p class="eyebrow">Player local</p>
      <h1>Reproduza um vídeo</h1>
      <p class="intro">Escolha um arquivo de vídeo deste dispositivo. O arquivo não é enviado para um servidor.</p>

      <label class="file-picker">
        <span class="file-picker-icon" aria-hidden="true">＋</span>
        <span><strong>Selecionar vídeo</strong><small>MP4, WebM e outros formatos aceitos pelo navegador</small></span>
        <input id="video-file" type="file" accept="video/*">
      </label>

      <p id="video-status" class="status" aria-live="polite">Nenhum vídeo selecionado.</p>
      <video id="player" controls playsinline preload="metadata" aria-label="Player de vídeo"></video>
    </main>
  </body>
</html>
