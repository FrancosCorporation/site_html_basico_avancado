<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Escolha um filme da trilogia Matrix para carregar no player.">
    <title>Trilogia Matrix | Francos Corporation</title>
    <script async src="https://www.google-analytics.com/analytics.js"></script>
    <link rel="stylesheet" href="../main/style.css">
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'UA-132699580-1');
    </script>
  </head>
  <body>
    <div class="metadeFundoEsquerda">
      <div class="ColunaEsquerda">
        <a id="voltar" href="../HomeFilmes/homeFilmes.html">← Voltar para filmes e séries</a>
        <h1>Trilogia Matrix</h1>
        <label for="select">Escolha um filme</label>
        <select id="select" class="select" aria-controls="content">
          <option value="none">Selecione um filme</option>
          <option value="Matrix">Matrix</option>
          <option value="Matrix-Reloaded">Matrix Reloaded</option>
          <option value="Matrix-Revolutions">Matrix Revolutions</option>
        </select>

        <div id="content" hidden>
          <div id="Matrix" class="data">
            <button
              type="button"
              onclick="setSrc('http://francoscorp.sytes.net/Videos/Filmes_Series/Trilogia Matrix/Matrix/Matrix.mp4','http://francoscorp.sytes.net/Videos/Filmes_Series/Trilogia Matrix/Matrix/Matrix.vtt')"
            >
            Matrix
            </button>
          </div>
          <div id="Matrix-Reloaded" class="data" hidden>
            <button
              type="button"
              onclick="setSrc('../Videos/Filmes_Series/Trilogia Matrix/Matrix Reloaded/Matrix-Reloaded.mp4','../Videos/Filmes_Series/Trilogia Matrix/Matrix Reloaded/Matrix-Reloaded.vtt')"
            >
            Matrix Reloaded
            </button>
          </div>
          <div id="Matrix-Revolutions" class="data" hidden>
            <button
              type="button"
              onclick="setSrc('../Videos/Filmes_Series/Trilogia Matrix/Matrix Revolutions/Matrix-Revolutions.mp4','../Videos/Filmes_Series/Trilogia Matrix/Matrix Revolutions/Matrix-Revolutions.vtt')"
            >
            Matrix Revolutions
            </button>
          </div>
        </div>
      </div>
      <div class="container2">
        <p id="player-status" aria-live="polite">Escolha um filme para carregar o vídeo.</p>
        <video controls playsinline preload="metadata" id="player" poster="../images/Culture_Matrix_Code_corridor.jpg" aria-label="Player de vídeo da trilogia Matrix">
          <track id="legenda" kind="captions" label="Português" srclang="pt-BR" src="empty-captions.vtt">
        </video>
      </div>
    </div>
    <script src="../main/script.js"></script>
  </body>
</html>
